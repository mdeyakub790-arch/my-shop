<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আমার দোকান</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;font-family:Arial,"Noto Sans Bengali",sans-serif;color:#222}.top{background:#f85606;color:#fff;padding:7px 4%;font-size:13px}header{background:#fff;padding:13px 4%;display:flex;gap:15px;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}.logo{font-size:23px;font-weight:800;color:#f85606;white-space:nowrap}.search{flex:1;border:2px solid #f85606;display:flex}.search input{flex:1;padding:11px;border:0;outline:0}.search button{background:#f85606;color:#fff;border:0;padding:0 20px}.cart{background:#fff;border:0;font-weight:bold}.nav{background:#fff;padding:9px 4%;display:flex;gap:8px;overflow:auto}.nav button{border:0;background:#fff3ed;color:#e44e00;padding:8px 14px;border-radius:20px;white-space:nowrap}.wrap{max-width:1200px;margin:auto;padding:14px}.hero{background:linear-gradient(110deg,#f85606,#ff9500);color:#fff;border-radius:7px;padding:25px;display:flex;justify-content:space-between;align-items:center}.hero h1{font-size:32px;margin:0 0 8px}.sale{font-size:45px;font-weight:900}.title{display:flex;justify-content:space-between;margin:18px 0 10px}.title h2{margin:0}.title a{color:#f85606}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;position:relative;box-shadow:0 1px 5px #0001}.pic{height:155px;display:flex;align-items:center;justify-content:center;background:#fafafa;font-size:65px}.info{padding:10px}.name{height:40px;overflow:hidden;font-size:14px}.stars{color:#ffb000;font-size:13px;margin:5px 0}.price{color:#f85606;font-weight:bold;font-size:19px}.old{text-decoration:line-through;color:#999;font-size:12px}.add{width:100%;margin-top:8px;padding:8px;background:#fff;border:1px solid #f85606;color:#f85606}.badge{position:absolute;left:6px;top:6px;background:#f85606;color:#fff;padding:3px;font-size:11px}.wish{position:absolute;right:5px;top:5px;border:0;background:#fff;border-radius:50%;font-size:19px}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end;justify-content:center}.box{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:15px 15px 0 0;padding:18px}.close{float:right;border:0;border-radius:50%;padding:8px}.item{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:9px 0}.emoji{font-size:30px}.main{flex:1}.qty button{width:28px;height:28px;background:#fff;border:1px solid #ddd}.total{text-align:right;font-size:20px;font-weight:bold;padding:13px 0}input,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:4px}.order{width:100%;padding:12px;background:#25d366;color:#fff;border:0;border-radius:5px;font-weight:bold;font-size:16px}footer{margin-top:25px;background:#222;color:#ddd;text-align:center;padding:25px}.bottom{display:none}
@media(max-width:800px){header{padding:9px;gap:7px}.logo{font-size:18px}.search input{padding:8px}.search button{padding:0 12px}.products{grid-template-columns:repeat(2,1fr);gap:7px}.pic{height:125px;font-size:55px}.hero{padding:18px}.hero h1{font-size:24px}.sale{font-size:35px}.wrap{padding:8px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:10;justify-content:space-around;padding:7px;border-top:1px solid #ddd}.bottom button{border:0;background:#fff}.bottom b{display:block;color:#f85606;font-size:18px}footer{padding-bottom:65px}}

<div class="top">🎉 বিশেষ অফার • দ্রুত অর্ডার • WhatsApp যোগাযোগ</div>
<header><div class="logo">🛍️ আমার দোকান</div><div class="search"><input id="search" placeholder="পণ্য খুঁজুন..." oninput="render()"><button>🔍</button></div><button class="cart" onclick="openCart()">🛒 (<b id="count">0</b>)</button></header>
<div class="nav" id="cats"></div><main class="wrap"><section class="hero"><div><h1>সেরা পণ্য, সেরা দাম</h1><p>আপনার পছন্দের পণ্য সহজেই অর্ডার করুন</p></div><div class="sale">SALE<br>৫০+</div></section>
<div class="title"><h2>🔥 জনপ্রিয় পণ্য</h2><a href="https://www.facebook.com/profile.php?id=61594248275340" target="_blank">আমার পেইজ →</a></div><div class="products" id="products"></div></main>
<footer><h2>🛍️ আমার দোকান</h2><p>অনলাইনে পছন্দের পণ্য অর্ডার করুন</p><a href="https://www.facebook.com/profile.php?id=61594248275340" target="_blank">📘 Facebook Page</a></footer>
<div class="bottom"><button onclick="location.reload()"><b>⌂</b>হোম</button><button onclick="document.getElementById('cats').scrollIntoView()"><b>☰</b>ক্যাটাগরি</button><button onclick="openCart()"><b>🛒</b>কার্ট</button><button onclick="window.open('https://www.facebook.com/profile.php?id=61594248275340','_blank')"><b>f</b>পেইজ</button></div>
<div class="modal" id="modal"><div class="box"><button class="close" onclick="closeCart()">✕</button><h2>🛒 আপনার কার্ট</h2><div id="cartItems"></div><div class="total">মোট: ৳<span id="total">0</span></div><form onsubmit="sendOrder(event)"><h3>অর্ডারের তথ্য</h3><input id="cname" required placeholder="আপনার নাম"><input id="phone" required placeholder="মোবাইল নম্বর"><textarea id="address" required rows="3" placeholder="সম্পূর্ণ ঠিকানা"></textarea><button class="order">📲 WhatsApp-এ অর্ডার নিশ্চিত করুন</button></form></div></div>
<script>
const P=["টি-শার্ট|ফ্যাশন|👕|500|650","স্টাইলিশ জুতা|ফ্যাশন|👟|1200|1500","স্মার্ট ঘড়ি|ইলেকট্রনিক্স|⌚|1500|1900","সানগ্লাস|ফ্যাশন|🕶️|800|1000","ব্যাকপ্যাক|ফ্যাশন|🎒|900|1200","হেডফোন|ইলেকট্রনিক্স|🎧|1100|1400","মোবাইল কভার|মোবাইল|📱|300|450","পারফিউম|বিউটি|🧴|1000|1300","ক্যাপ|ফ্যাশন|🧢|350|500","ওয়ালেট|ফ্যাশন|👛|450|650","বেল্ট|ফ্যাশন|🪢|400|600","শার্ট|ফ্যাশন|👔|700|900","জিন্স প্যান্ট|ফ্যাশন|👖|950|1200","কিডস ড্রেস|বাচ্চাদের|👗|650|850","বাচ্চাদের জুতা|বাচ্চাদের|👞|550|750","খেলনা গাড়ি|বাচ্চাদের|🚗|400|550","ফুটবল|স্পোর্টস|⚽|600|800","ক্রিকেট ব্যাট|স্পোর্টস|🏏|1100|1400","ব্যাডমিন্টন র‍্যাকেট|স্পোর্টস|🏸|750|950","স্পোর্টস জার্সি|স্পোর্টস|🥋|800|1050","পাওয়ার ব্যাংক|ইলেকট্রনিক্স|🔋|1200|1500","ব্লুটুথ স্পিকার|ইলেকট্রনিক্স|🔊|950|1250","ইয়ারবাড|ইলেকট্রনিক্স|🎧|1300|1700","USB কেবল|ইলেকট্রনিক্স|🔌|250|350","চার্জার|ইলেকট্রনিক্স|🔌|500|700","LED লাইট|হোম|💡|300|450","টেবিল ল্যাম্প|হোম|💡|650|850","কিচেন সেট|হোম|🍳|900|1200","পানির বোতল|হোম|🍼|350|500","কফি মগ|হোম|☕|300|450","নোটবুক|স্টেশনারি|📓|180|250","কলম সেট|স্টেশনারি|🖊️|150|220","ব্যাগ|ফ্যাশন|👜|800|1100","মেকআপ কিট|বিউটি|💄|1200|1600","ফেস ক্রিম|বিউটি|🧴|650|850","লিপস্টিক|বিউটি|💄|400|600","হেয়ার ড্রায়ার|বিউটি|💨|1000|1300","চিরুনি সেট|বিউটি|💇|250|350","রান্নার প্যান|হোম|🍳|850|1100","স্টোরেজ বক্স|হোম|📦|500|700","বেডশিট|হোম|🛏️|1000|1300","তোয়ালে|হোম|🧻|450|600","স্মার্ট ব্যান্ড|ইলেকট্রনিক্স|⌚|900|1200","মাউস|ইলেকট্রনিক্স|🖱️|550|750","কিবোর্ড|ইলেকট্রনিক্স|⌨️|850|1100","মোবাইল স্ট্যান্ড|মোবাইল|📱|300|450","স্ক্রিন প্রটেক্টর|মোবাইল|📱|180|280","সেলফি স্টিক|মোবাইল|🤳|450|600","ট্রাভেল ব্যাগ|ফ্যাশন|🧳|1300|1700","স্পোর্টস জুতা|স্পোর্টস|👟|1400|1800","যোগা ম্যাট|স্পোর্টস|🧘|700|950","পাজল গেম|বাচ্চাদের|🧩|350|500","পুতুল|বাচ্চাদের|🪆|450|650","স্কুল ব্যাগ|বাচ্চাদের|🎒|750|950","বেবি ড্রেস|বাচ্চাদের|👶|550|750","ঘড়ি|ফ্যাশন|⌚|800|1100","কিচেন টুল|হোম|🥄|350|500","ডেকোরেশন লাইট|হোম|✨|600|800"].map(x=>{let a=x.split("|");return{name:a[0],cat:a[1],icon:a[2],price:+a[3],old:+a[4]}});let cart=[],active="সব";
const cats=["সব",...new Set(P.map(x=>x.cat))];document.getElementById("cats").innerHTML=cats.map(c=>`<button onclick="active='${c}';render()">${c}</button>`).join("");
function render(){let q=document.getElementById("search").value.toLowerCase();document.getElementById("products").innerHTML=P.map((p,i)=>[p,i]).filter(([p])=>(active=="সব"||p.cat==active)&&p.name.toLowerCase().includes(q)).map(([p,i])=>`<div class="card"><span class="badge">অফার</span><button class="wish">♡</button><div class="pic">${p.icon}</div><div class="info"><div class="name">${p.name}</div><div class="stars">★★★★★</div><div class="price">৳${p.price} <span class="old">৳${p.old}</span></div><button class="add" onclick="add(${i})">কার্টে যোগ করুন</button></div></div>`).join("")}
function add(i){let x=cart.find(a=>a.i==i);x?x.q++:cart.push({i,q:1});update();alert("পণ্যটি কার্টে যোগ হয়েছে")}
function update(){document.getElementById("count").textContent=cart.reduce((s,x)=>s+x.q,0)}
function openCart(){document.getElementById("modal").style.display="flex";draw()}
function closeCart(){document.getElementById("modal").style.display="none"}
function draw(){let t=0;if(!cart.length){cartItems.innerHTML='<p style="text-align:center;padding:20px">কার্ট খালি</p>';total.textContent=0;return}cartItems.innerHTML=cart.map((x,n)=>{let p=P[x.i];t+=p.price*x.q;return `<div class="item"><span class="emoji">${p.icon}</span><span class="main"><b>${p.name}</b><br>৳${p.price} × ${x.q}</span><span class="qty"><button onclick="chg(${n},-1)">−</button>${x.q}<button onclick="chg(${n},1)">+</button><button onclick="del(${n})">🗑️</button></span></div>`}).join("");total.textContent=t;update()}
function chg(n,d){cart[n].q+=d;if(cart[n].q<1)cart.splice(n,1);draw()}function del(n){cart.splice(n,1);draw()}
function sendOrder(e){e.preventDefault();if(!cart.length)return alert("কার্টে পণ্য যোগ করুন");let n=cname.value,ph=phone.value,a=address.value,t=0,m=`🛍️ নতুন অর্ডার - আমার দোকান\n\n👤 নাম: ${n}\n📱 মোবাইল: ${ph}\n📍 ঠিকানা: ${a}\n\n📦 পণ্য:\n`;cart.forEach(x=>{let p=P[x.i];t+=p.price*x.q;m+=`• ${p.name} × ${x.q} = ৳${p.price*x.q}\n`});m+=`\n💰 মোট: ৳${t}`;location.href="https://wa.me/966567225245?text="+encodeURIComponent(m)}
render();update();
</script></body></html>
