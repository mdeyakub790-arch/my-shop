<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমার দোকান</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-size: 28px;
  font-weight: bold;
}

.cart-btn {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

.hero {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  text-align: center;
  padding: 60px 20px;
}

.hero h1 {
  font-size: 40px;
  margin-bottom: 12px;
}

.hero p {
  font-size: 20px;
}

.search-box {
  max-width: 600px;
  margin: 30px auto;
  padding: 0 20px;
}

.search-box input {
  width: 100%;
  padding: 16px;
  border: 2px solid #ddd;
  border-radius: 12px;
  font-size: 18px;
}

.products {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
}

.product {
  background: white;
  border-radius: 15px;
  padding: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
  text-align: center;
}

.product-img {
  width: 100%;
  height: 180px;
  border-radius: 12px;
  background: #eef2ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  margin-bottom: 15px;
}

.product h3 {
  font-size: 22px;
  margin-bottom: 10px;
}

.price {
  color: #2563eb;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 15px;
}

.add-btn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.add-btn:active {
  transform: scale(0.97);
}

/* CART */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  z-index: 500;
}

.cart-box {
  display: none;
  position: fixed;
  z-index: 600;
  background: white;
  width: 94%;
  max-width: 650px;
  max-height: 90vh;
  overflow-y: auto;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border-radius: 22px;
  padding: 25px;
}

.cart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.cart-header h2 {
  font-size: 32px;
}

.close-btn {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: #ef4444;
  color: white;
  font-size: 28px;
  cursor: pointer;
}

.cart-item {
  border-bottom: 1px solid #ddd;
  padding: 18px 0;
}

.cart-item h3 {
  font-size: 22px;
  margin-bottom: 8px;
}

.cart-price {
  color: #2563eb;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.quantity-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.quantity-row button {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.quantity {
  font-size: 22px;
  min-width: 25px;
  text-align: center;
}

.delete-btn {
  margin-left: 10px;
  background: #ef4444 !important;
}

.total {
  text-align: right;
  font-size: 30px;
  font-weight: bold;
  margin: 25px 0;
}

.whatsapp-btn {
  width: 100%;
  padding: 18px;
  border: none;
  border-radius: 14px;
  background: #16a34a;
  color: white;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
}

.whatsapp-btn:active {
  transform: scale(0.98);
}

.empty {
  text-align: center;
  padding: 40px 10px;
  font-size: 22px;
  color: #666;
}

footer {
  margin-top: 50px;
  padding: 30px;
  background: #111827;
  color: white;
  text-align: center;
}

@media (max-width: 600px) {

  .logo {
    font-size: 24px;
  }

  .cart-btn {
    font-size: 16px;
    padding: 10px 13px;
  }

  .hero h1 {
    font-size: 30px;
  }

  .hero p {
    font-size: 17px;
  }

  .cart-box {
    width: 95%;
    padding: 18px;
  }

  .cart-header h2 {
    font-size: 27px;
  }

  .total {
    font-size: 27px;
  }

  .whatsapp-btn {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    🛒 আমার দোকান
  </div>

  <button class="cart-btn" onclick="openCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>

</header>


<section class="hero">

  <h1>আমার অনলাইন দোকানে স্বাগতম</h1>

  <p>পছন্দের পণ্য কিনুন সহজেই</p>

</section>


<div class="search-box">

  <input
    type="text"
    id="searchInput"
    placeholder="🔍 পণ্য খুঁজুন..."
    oninput="searchProducts()"
  >

</div>


<section class="products" id="products">

  <div class="product" data-name="সুন্দর টি-শার্ট">

    <div class="product-img">👕</div>

    <h3>সুন্দর টি-শার্ট</h3>

    <div class="price">৳500</div>

    <button class="add-btn"
      onclick="addToCart('সুন্দর টি-শার্ট', 500)">
      🛒 Cart-এ যোগ করুন
    </button>

  </div>


  <div class="product" data-name="স্টাইলিশ জুতা">

    <div class="product-img">👟</div>

    <h3>স্টাইলিশ জুতা</h3>

    <div class="price">৳1200</div>

    <button class="add-btn"
      onclick="addToCart('স্টাইলিশ জুতা', 1200)">
      🛒 Cart-এ যোগ করুন
    </button>

  </div>


  <div class="product" data-name="স্মার্ট ঘড়ি">

    <div class="product-img">⌚</div>

    <h3>স্মার্ট ঘড়ি</h3>

    <div class="price">৳1500</div>

    <button class="add-btn"
      onclick="addToCart('স্মার্ট ঘড়ি', 1500)">
      🛒 Cart-এ যোগ করুন
    </button>

  </div>


  <div class="product" data-name="সানগ্লাস">

    <div class="product-img">🕶️</div>

    <h3>সানগ্লাস</h3>

    <div class="price">৳800</div>

    <button class="add-btn"
      onclick="addToCart('সানগ্লাস', 800)">
      🛒 Cart-এ যোগ করুন
    </button>

  </div>


  <div class="product" data-name="ব্যাকপ্যাক">

    <div class="product-img">🎒</div>

    <h3>ব্যাকপ্যাক</h3>

    <div class="price">৳900</div>

    <button class="add-btn"
      onclick="addToCart('ব্যাকপ্যাক', 900)">
      🛒 Cart-এ যোগ করুন
    </button>

  </div>


  <div class="product" data-name="হেডফোন">

    <div class="product-img">🎧</div>

    <h3>হেডফোন</h3>

    <div class="price">৳1100</div>

    <button class="add-btn"
      onclick="addToCart('হেডফোন', 1100)">
      🛒 Cart-এ যোগ করুন
    </button>

  </div>


  <div class="product" data-name="মোবাইল কভার">

    <div class="product-img">📱</div>

    <h3>মোবাইল কভার</h3>

    <div class="price">৳300</div>

    <button class="add-btn"
      onclick="addToCart('মোবাইল কভার', 300)">
      🛒 Cart-এ যোগ করুন
    </button>

  </div>


  <div class="product" data-name="পারফিউম">

    <div class="product-img">🧴</div>

    <h3>পারফিউম</h3>

    <div class="price">৳1000</div>

    <button class="add-btn"
      onclick="addToCart('পারফিউম', 1000)">
      🛒 Cart-এ যোগ করুন
    </button>

  </div>

</section>


<!-- OVERLAY -->

<div
  class="overlay"
  id="overlay"
  onclick="closeCart()">
</div>


<!-- CART -->

<div class="cart-box" id="cartBox">

  <div class="cart-header">

    <h2>🛒 আপনার কার্ট</h2>

    <button
      class="close-btn"
      onclick="closeCart()">
      ×
    </button>

  </div>


  <div id="cartItems"></div>


  <div class="total">
    মোট: ৳<span id="cartTotal">0</span>
  </div>


  <button
    class="whatsapp-btn"
    onclick="orderWhatsApp()">

    📱 WhatsApp-এ অর্ডার করুন

  </button>

</div>


<footer>

  © 2026 আমার দোকান  
  <br>
  সব অধিকার সংরক্ষিত

</footer>


<script>

/* =========================
   CART DATA
========================= */

let cart = [];


/* =========================
   ADD TO CART
========================= */

function addToCart(name, price) {

  const existing = cart.find(
    item => item.name === name
  );

  if (existing) {

    existing.quantity += 1;

  } else {

    cart.push({
      name: name,
      price: price,
      quantity: 1
    });

  }

  updateCart();

  alert(name + " Cart-এ যোগ হয়েছে!");

}


/* =========================
   UPDATE CART
========================= */

function updateCart() {

  const cartItems =
    document.getElementById("cartItems");

  const cartCount =
    document.getElementById("cartCount");

  const cartTotal =
    document.getElementById("cartTotal");


  cartItems.innerHTML = "";

  let total = 0;
  let count = 0;


  if (cart.length === 0) {

    cartItems.innerHTML =
      '<div class="empty">আপনার Cart খালি 🛒</div>';

  }


  cart.forEach((item, index) => {

    const quantity =
      item.quantity || 1;

    const itemTotal =
      item.price * quantity;

    total += itemTotal;

    count += quantity;


    const div =
      document.createElement("div");

    div.className = "cart-item";


    div.innerHTML = `

      <h3>${item.name}</h3>

      <div class="cart-price">
        ৳${item.price} × ${quantity}
        = ৳${itemTotal}
      </div>

      <div class="quantity-row">

        <button
          onclick="decreaseQuantity(${index})">
          −
        </button>

        <div class="quantity">
          ${quantity}
        </div>

        <button
          onclick="increaseQuantity(${index})">
          +
        </button>

        <button
          class="delete-btn"
          onclick="removeFromCart(${index})">
          🗑️
        </button>

      </div>

    `;


    cartItems.appendChild(div);

  });


  cartCount.textContent = count;

  cartTotal.textContent = total;

}


/* =========================
   PLUS
========================= */

function increaseQuantity(index) {

  cart[index].quantity += 1;

  updateCart();

}


/* =========================
   MINUS
========================= */

function decreaseQuantity(index) {

  if (cart[index].quantity > 1) {

    cart[index].quantity -= 1;

  } else {

    cart.splice(index, 1);

  }

  updateCart();

}


/* =========================
   DELETE
========================= */

function removeFromCart(index) {

  cart.splice(index, 1);

  updateCart();

}


/* =========================
   OPEN CART
========================= */

function openCart() {

  document.getElementById("cartBox")
    .style.display = "block";

  document.getElementById("overlay")
    .style.display = "block";

  updateCart();

}


/* =========================
   CLOSE CART
========================= */

function closeCart() {

  document.getElementById("cartBox")
    .style.display = "none";

  document.getElementById("overlay")
    .style.display = "none";

}


/* =========================
   SEARCH
========================= */

function searchProducts() {

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase();

  const products =
    document.querySelectorAll(".product");


  products.forEach(product => {

    const name =
      product.dataset.name.toLowerCase();

    if (name.includes(search)) {

      product.style.display = "";

    } else {

      product.style.display = "none";

    }

  });

}


/* =========================
   WHATSAPP ORDER
========================= */

function orderWhatsApp() {

  /* Cart খালি হলে */

  if (cart.length === 0) {

    alert("আপনার Cart খালি!");

    return;

  }


  /* WhatsApp Message */

  let message =
    "🛍️ আমার দোকানে নতুন অর্ডার\n\n";


  let total = 0;


  cart.forEach((item, index) => {

    const quantity =
      item.quantity || 1;

    const itemTotal =
      item.price * quantity;


    total += itemTotal;


    message +=
      (index + 1) +
      ". " +
      item.name +
      "\n";

    message +=
      "পরিমাণ: " +
      quantity +
      "\n";

    message +=
      "দাম: ৳" +
      itemTotal +
      "\n\n";

  });


  message +=
    "💰 মোট: ৳" +
    total +
    "\n\n";


  message +=
    "📦 অনুগ্রহ করে আমার অর্ডারটি গ্রহণ করুন।";


  /* আপনার WhatsApp নম্বর */

  const whatsappNumber =
    "966567225245";


  /* WhatsApp Link */

  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);


  /* মোবাইলে WhatsApp খোলার জন্য */

  window.location.href =
    whatsappURL;

}


/* =========================
   START
========================= */

updateCart();

</script>

</body>
</html>
