<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin - Eyakub Shop</title>
<link rel="stylesheet" href="css/style.css"><script src="js/store.js"></script></head><body>
<div id="login" class="wrap" style="max-width:360px;margin-top:80px"><h2>🔐 Admin Login</h2><label>ইউজারনেম</label><input id="u"><label>পাসওয়ার্ড</label><input id="pw" type="password"><br><br><button class="btn" style="width:100%" onclick="login()">প্রবেশ করুন</button></div>
<div id="app" style="display:none"><header><div class="wrap top"><span class="logo">⚙️ Admin Panel</span><span style="flex:1"></span><a href="index.html" class="btn sm">সাইট দেখুন</a><button class="btn sm red" onclick="sessionStorage.clear();location.reload()">লগআউট</button></div></header>
<div class="wrap"><p class="meta" style="margin:12px 0;background:#fff8e1;padding:10px;border-radius:8px">⚠️ পরিবর্তনগুলো শুধু এই ব্রাউজারে সেভ হয়। সবাইকে দেখাতে <b>"products.json ডাউনলোড"</b> করে GitHub এ আপলোড (replace) করুন।</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px"><button class="btn" onclick="edit()">+ নতুন পণ্য</button><button class="btn w" style="border:1px solid var(--g)" onclick="dl()">⬇ products.json ডাউনলোড</button><button class="btn w" style="border:1px solid #ccc" onclick="if(confirm('সব রিসেট হবে!')){localStorage.removeItem(KEY);location.reload()}">রিসেট</button><input id="s" placeholder="খুঁজুন..." style="max-width:220px" oninput="draw()"></div>
<div class="tbw"><table class="tb"><thead><tr><th>ছবি</th><th>নাম</th><th>ক্যাটাগরি</th><th>দাম</th><th>স্টক</th><th></th></tr></thead><tbody id="tb"></tbody></table></div><br><button class="btn sm" onclick="pg++;draw()">আরও দেখুন</button></div></div>
<div class="modal" id="m"><div class="box" style="max-width:600px"><button class="x" onclick="m.classList.remove('on')">×</button><h2 id="mt" style="margin-top:0"></h2>
<label>নাম</label><input id="fn"><div class="f2"><div><label>ক্যাটাগরি (নতুন লিখলে নতুন ক্যাটাগরি হবে)</label><input id="fc" list="cl"><datalist id="cl"></datalist></div><div><label>স্টক (পিস)</label><input id="fs" type="number"></div></div>
<div class="f2"><div><label>আগের দাম</label><input id="fo" type="number"></div><div><label>এখনকার দাম</label><input id="fp" type="number"></div></div>
<label>কালার (কমা দিয়ে)</label><input id="fcl" placeholder="কালো, সাদা"><label>সাইজ (কমা দিয়ে)</label><input id="fz" placeholder="39, 40, 41">
<label>বিবরণ</label><textarea id="fd" rows="2"></textarea><label>ছবি (Choose file → গ্যালারি)</label><input id="ff" type="file" accept="image/*"><img id="pv" style="width:90px;margin-top:6px;border-radius:8px">
<button class="btn" style="width:100%;margin-top:14px" onclick="save()">সেভ করুন</button></div></div>
<script>
let P=[],pg=1,ed=null,im='';const $=i=>document.getElementById(i),m=$('m');
function login(){if($('u').value===CFG.user&&$('pw').value===CFG.pass){sessionStorage.a=1;init()}else alert('ভুল ইউজারনেম/পাসওয়ার্ড')}
async function init(){if(!sessionStorage.a)return;$('login').style.display='none';$('app').style.display='block';P=await loadProducts();draw()}
function draw(){const q=$('s').value.toLowerCase();$('tb').innerHTML=P.filter(p=>p.name.toLowerCase().includes(q)).slice(0,pg*30).map(p=>`<tr><td><img src="${p.img||art(p.cat,p.color[0])}"></td><td>${p.name}</td><td>${catName(p.cat)}</td><td>${tk(p.price)} <s class="meta">${tk(p.old)}</s></td><td>${p.stock}</td><td style="white-space:nowrap"><button class="btn sm" onclick="edit(${p.id})">এডিট</button> <button class="btn sm red" onclick="del(${p.id})">ডিলিট</button></td></tr>`).join('')}
function edit(id){ed=P.find(p=>p.id===id)||null;const p=ed||{name:'',cat:'shoes',stock:10,old:'',price:'',color:[],sizes:[],desc:'',img:''};im=p.img;
 $('mt').textContent=ed?'পণ্য এডিট':'নতুন পণ্য';$('fn').value=p.name;$('fc').value=p.cat;$('fs').value=p.stock;$('fo').value=p.old;$('fp').value=p.price;$('fcl').value=p.color.join(', ');$('fz').value=p.sizes.join(', ');$('fd').value=p.desc;$('ff').value='';$('pv').src=p.img||'';
 $('cl').innerHTML=[...new Set([...Object.keys(CATS),...P.map(x=>x.cat)])].map(c=>`<option value="${c}">`).join('');m.classList.add('on')}
$('ff').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,500/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);im=c.toDataURL('image/jpeg',.75);$('pv').src=im};i.src=r.result};r.readAsDataURL(f)};
function save(){const L=v=>v.split(',').map(s=>s.trim()).filter(Boolean);if(!$('fn').value||!$('fp').value)return alert('নাম ও দাম দিন');
 const o={name:$('fn').value,cat:$('fc').value.trim()||'shoes',stock:+$('fs').value||0,old:+$('fo').value||+$('fp').value,price:+$('fp').value,color:L($('fcl').value).length?L($('fcl').value):['কালো'],sizes:L($('fz').value).length?L($('fz').value):['Free'],desc:$('fd').value,img:im||''};
 if(ed)Object.assign(ed,o);else P.unshift({id:Math.max(0,...P.map(p=>p.id))+1,sold:0,rating:'4.5',...o});saveProducts(P);m.classList.remove('on');draw()}
function del(id){if(confirm('ডিলিট করবেন?')){P=P.filter(p=>p.id!==id);saveProducts(P);draw()}}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));a.download='products.json';a.click()}
init();
</script></body></html>
