<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eyakub Shop — Admin Panel</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="login"><div class="login-box"><div class="admin-logo">🛒 <b>Eyakub</b> Shop</div><h1>Admin Login</h1><p>শুধু দোকানের মালিকের জন্য</p><form id="loginForm"><input id="user" placeholder="Username" required><input id="pass" type="password" placeholder="Password" required><button>Login</button><small>ডিফল্ট: admin / Eyakub@12345</small></form></div></div>
<div id="panel" class="panel hidden"><aside><div class="admin-logo">🛒 Eyakub <b>Shop</b></div><nav><button data-view="dashboard">📊 Dashboard</button><button data-view="products">📦 Products</button><button data-view="orders">🧾 Orders</button><button data-view="settings">⚙️ Settings</button><a href="index.html">↗ Website</a></nav><button id="logout" class="logout">Logout</button></aside><main><header><button id="sideBtn">☰</button><div><h2 id="viewTitle">Dashboard</h2><p>আপনার স্টোর কন্ট্রোল করুন</p></div></header><section id="view"></section></main></div>
<div id="productEditor" class="modal"><div class="editor"><button class="x" id="closeEditor">×</button><h2 id="editorTitle">নতুন পণ্য</h2><form id="productForm"><input type="hidden" name="id"><div class="grid"><label>Product Name *<input name="name" required></label><label>Category *<select name="category"><option value="shoes">জুতা</option><option value="bags">ব্যাগ</option></select></label><label>SKU<input name="sku"></label><label>Stock<input name="stock" type="number" min="0"></label><label>আগের দাম<input name="oldPrice" type="number" min="0"></label><label>বর্তমান দাম *<input name="price" type="number" min="0" required></label><label>Colors<input name="colors" placeholder="Black, White"></label><label>Sizes<input name="sizes" placeholder="39, 40, 41"></label><label>Rating<input name="rating" type="number" min="0" max="5" step=".1"></label><label>Sold<input name="sold" type="number" min="0"></label><label class="wide">Description<textarea name="description"></textarea></label><label class="wide">Product Image<input name="imageFile" type="file" accept="image/*"></label><label class="wide">Or Image URL<input name="image"></label><label class="check"><input name="featured" type="checkbox"> Popular/Featured</label><label class="check"><input name="flash" type="checkbox"> Flash Sale</label></div><div class="preview"><img id="imagePreview"></div><button class="save" type="submit">Save Product</button></form></div></div>
<script src="products.js"></script><script src="admin.js"></script></body></html>
